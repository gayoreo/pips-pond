<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>calc.js tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    .pass { color: #1a7f37; } .fail { color: #b3261e; font-weight: 700; }
  </style>
</head>
<body>
  <h1>calc.js tests</h1>
  <p id="summary"></p>
  <ol id="out"></ol>

  <script type="module">
    import { budget, balances } from '../js/core/calc.js';
    import { eatingDays, startOfWeek, addDays, dayOfWeek } from '../js/core/dates.js';
    import { learnWeights } from '../js/core/weights.js';
    import { rolloverFor, nextSemesterDefaults, reportStats } from '../js/core/semester.js';
    import { parseCSV, parseDateLoose, parseAmount, mapSchoolRows } from '../js/data/importExport.js';

    const out = document.getElementById('out');
    let passed = 0, failed = 0;
    function check(name, actual, expected) {
      const ok = typeof expected === 'number' ? Math.abs(actual - expected) < 0.001 : actual === expected;
      ok ? passed++ : failed++;
      out.insertAdjacentHTML('beforeend',
        `<li class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name} — got ${actual}, expected ${expected}</li>`);
    }

    // Sep 1 2026 is a Tuesday. Week starts Sunday. Sep 5–6 are days off.
    const s = {
      start: '2026-09-01', end: '2026-09-10', weekStart: 0,
      swipesTotal: 10, pointsTotal: 100,
      exchangeLimit: 2, exchangeUsesSwipe: false,
      daysOff: [{ from: '2026-09-05', to: '2026-09-06', label: 'Trip' }],
    };

    check('eating days (10 minus 2 off)', eatingDays(s.start, s.end, s.daysOff), 8);
    check('start of week for Wed Sep 2', startOfWeek('2026-09-02', 0), '2026-08-30');

    let b = budget(s, [], '2026-09-01');
    check('week 1 swipe pool (4 of 8 days → 5)', b.swipes.weekly, 5);
    check('day 1 swipes available = whole week pool', b.swipes.leftToday, 5);
    check('day 1 daily points', b.points.daily, 12.5);

    const e = [
      { type: 'swipe', amount: 2, date: '2026-09-01' },
      { type: 'points', amount: 20, date: '2026-09-01' },
    ];
    check('after 2 swipes today → 3 left', budget(s, e, '2026-09-01').swipes.leftToday, 3);

    b = budget(s, e, '2026-09-02');
    check('next day swipes carry the rest of the pool (3)', b.swipes.leftToday, 3);
    check('day 2 recalculated points (80 / 7 days)', b.points.daily, 80 / 7);

    b = budget(s, e, '2026-09-05');
    check('day off → no points allowance', b.points.daily, 0);
    check('day off flag', b.dayOff, true);
    check('day off → swipe pool still shown (3)', b.swipes.leftToday, 3);

    b = budget(s, [...e, { type: 'adjust-points', amount: 5, date: '2026-09-02' }], '2026-09-02');
    check('adjustment adds $5 (85 / 7)', b.points.daily, 85 / 7);

    const ex = [{ type: 'exchange', amount: 1, date: '2026-09-02' }];
    check('exchange counted this week', budget(s, ex, '2026-09-02').exchanges.used, 1);
    check('exchange does NOT use swipe', budget(s, ex, '2026-09-02').swipes.balance, 10);
    const on = { ...s, exchangeUsesSwipe: true };
    check('exchange DOES use swipe (toggle on)', budget(on, ex, '2026-09-02').swipes.balance, 9);
    check('exchange with toggle on → 4 swipes left this week', budget(on, ex, '2026-09-02').swipes.leftToday, 4);

    check('new week gets full remaining balance', budget(s, e, '2026-09-07').swipes.weekly, 8);
    check('whole swipes: 3.5/week → 4', budget({ ...s, swipesTotal: 7 }, [], '2026-09-01').swipes.weekly, 4);

    // Your example: Mon–Sun week with 3 swipes.
    const w = { start: '2026-09-07', end: '2026-09-13', weekStart: 1, swipesTotal: 3, pointsTotal: 0, exchangeLimit: 0, daysOff: [] };
    check('Monday shows 3 swipes', budget(w, [], '2026-09-07').swipes.leftToday, 3);
    check('use 1 Monday → Tuesday shows 2',
      budget(w, [{ type: 'swipe', amount: 1, date: '2026-09-07' }], '2026-09-08').swipes.leftToday, 2);
    check('use 3 Monday → Tuesday shows 0',
      budget(w, [{ type: 'swipe', amount: 3, date: '2026-09-07' }], '2026-09-08').swipes.leftToday, 0);

    check('exchanges allowed on Wednesday', budget(s, [], '2026-09-02').exchanges.allowedToday, true);
    check('exchanges NOT allowed on Saturday', budget(s, [], '2026-09-05').exchanges.allowedToday, false);

    // ---- Pass 4: funds, guests, weights, rollover, import ----
    check('added $50 points raises the balance', balances(s, [{ type: 'fund-points', amount: 50, date: '2026-09-02' }]).points, 150);
    check('added funds re-balance the daily budget (150 / 7)',
      budget(s, [{ type: 'fund-points', amount: 50, date: '2026-09-02' }], '2026-09-02').points.daily, 150 / 7);
    check('added swipes raise the swipe balance', balances(s, [{ type: 'fund-swipes', amount: 5, date: '2026-09-02' }]).swipes, 15);
    check('guest passes are counted separately',
      budget({ ...s, guestTotal: 4 }, [{ type: 'guest', amount: 1, date: '2026-09-02' }], '2026-09-02').guests.left, 3);
    check('guest passes don’t use swipes',
      budget({ ...s, guestTotal: 4 }, [{ type: 'guest', amount: 1, date: '2026-09-02' }], '2026-09-02').swipes.balance, 10);
    check('rolled-in points add to the total', budget({ ...s, pointsRolledIn: 20 }, [], '2026-09-01').points.total, 120);

    // Weights: 5 weeks where weekends cost nothing and weekdays cost $10
    const ws = { start: '2026-08-31', end: '2026-12-18', weekStart: 1, swipesTotal: 0, pointsTotal: 1000, exchangeLimit: 0, daysOff: [] };
    const hist = [];
    for (let k = ws.start; k < '2026-10-05'; k = addDays(k, 1)) {
      const d = dayOfWeek(k);
      if (d !== 0 && d !== 6) hist.push({ type: 'points', amount: 10, date: k });
    }
    const lw = learnWeights(ws, hist, '2026-10-05');
    check('auto-learn: weekday weight goes up', lw.weights[2] > 1, true);
    check('auto-learn: weekend weight goes down', lw.weights[6] < 1, true);
    check('auto-learn: not enough history → equal', learnWeights(ws, hist, '2026-09-10').weights[6], 1);
    check('equal mode ignores history', budget({ ...ws, weightMode: 'equal' }, hist, '2026-10-05').weights[6], 1);
    const wb = budget(ws, hist, '2026-10-06');
    check('weighted: a Tuesday gets more than an equal share', wb.points.daily > (1000 - 250) / eatingDays('2026-10-06', ws.end), true);

    check('rollover only when switched on', rolloverFor({ ...s, pointsRollover: true }, e).points, 80);
    check('rollover off → 0', rolloverFor(s, e).points, 0);
    check('next semester name', nextSemesterDefaults({ ...s, semesterName: 'Fall 2026' }, e).semesterName, 'Spring 2027');
    check('report card counts points spent', reportStats(s, e).pointsSpent, 20);

    check('CSV parser handles quotes', parseCSV('a,b\n"x, y",2')[1][0], 'x, y');
    check('date 9/21/2026', parseDateLoose('9/21/2026 12:04 PM'), '2026-09-21');
    check('date Sep 21, 2026', parseDateLoose('Sep 21, 2026'), '2026-09-21');
    check('amount -$5.45', parseAmount('-$5.45'), 5.45);
    const mapped = mapSchoolRows([['9/2/2026', '-$4.00', 'Starbucks'], ['9/2/2026', '$50.00', 'Deposit'], ['bad', '1', '']],
      { dateCol: 0, amountCol: 1, descCol: 2, mode: 'points', skipDeposits: true, existing: [] });
    check('import maps rows and skips deposits', mapped.entries.length, 1);

    document.getElementById('summary').textContent = `${passed} passed, ${failed} failed`;
  </script>
</body>
</html>
